<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>今天還能花多少</title>
<style>
  :root{
    --bg:#F5F6FA;
    --card:#FFFFFF;
    --text:#1A1A2E;
    --sub:#8A8AA3;
    --line:#ECECF3;
    --green:#2E9E6C;
    --red:#E0524D;
    --accent:#4C5FD5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 100px;}
  h1{font-size:1.05rem;font-weight:600;margin:4px 0 18px;display:flex;align-items:center;justify-content:space-between}
  h1 .gear{font-size:1.3rem;cursor:pointer;color:var(--sub);user-select:none;padding:4px}
  .card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,20,50,0.06);}
  .hero{text-align:center;padding:28px 20px;}
  .hero .label{color:var(--sub);font-size:0.85rem;margin-bottom:6px;}
  .hero .amount{font-size:2.6rem;font-weight:700;line-height:1.1;}
  .hero .amount.ok{color:var(--green);}
  .hero .amount.over{color:var(--red);}
  .hero .note{margin-top:8px;color:var(--sub);font-size:0.8rem;}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,20,50,0.06);}
  .stat .label{color:var(--sub);font-size:0.75rem;margin-bottom:4px;}
  .stat .value{font-size:1.15rem;font-weight:600;}
  .progress-outer{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;}
  .progress-inner{height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
  .progress-inner.over{background:var(--red);}
  .section-title{font-size:0.85rem;color:var(--sub);margin:22px 4px 8px;font-weight:600;}
  form.add{display:flex;gap:8px;}
  form.add input[type=number]{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;background:#FBFBFD;}
  form.add input[type=text]{flex:1.2;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;background:#FBFBFD;}
  form.add button{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 18px;font-size:1rem;font-weight:600;cursor:pointer;}
  form.add button:active{opacity:0.85}
  .row2{display:flex;gap:8px;margin-top:8px;}
  .expense-list{list-style:none;margin:0;padding:0;}
  .expense-list li{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);}
  .expense-list li:last-child{border-bottom:none;}
  .expense-list .info{display:flex;flex-direction:column;}
  .expense-list .note{font-size:0.95rem;}
  .expense-list .date{font-size:0.75rem;color:var(--sub);margin-top:2px;}
  .expense-list .amt{font-weight:600;margin-right:10px;}
  .expense-list .del{color:var(--sub);background:none;border:none;font-size:1.1rem;cursor:pointer;padding:4px 8px;}
  .empty{color:var(--sub);text-align:center;padding:24px 0;font-size:0.9rem;}
  .day-group-title{font-size:0.75rem;color:var(--sub);margin:14px 4px 2px;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,40,0.4);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;}
  .modal h2{margin:0 0 16px;font-size:1.05rem;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.85rem;color:var(--sub);margin-bottom:6px;}
  .field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;background:#FBFBFD;}
  .field .hint{font-size:0.75rem;color:var(--sub);margin-top:6px;}
  .modal .actions{display:flex;gap:10px;margin-top:6px;}
  .modal button.primary{flex:1;border:none;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;}
  .modal button.secondary{border:none;background:var(--line);color:var(--text);border-radius:12px;padding:13px 18px;font-size:1rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>今天還能花多少 <span class="gear" id="openSettings">⚙️</span></h1>

  <div class="card hero">
    <div class="label">今天還可以花</div>
    <div class="amount" id="todayAmount">--</div>
    <div class="note" id="todayNote"></div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">本月已花</div>
      <div class="value" id="spentTotal">--</div>
    </div>
    <div class="stat">
      <div class="label">本月預算</div>
      <div class="value" id="budgetTotal">--</div>
    </div>
    <div class="stat">
      <div class="label">剩餘天數</div>
      <div class="value" id="daysLeft">--</div>
    </div>
    <div class="stat">
      <div class="label">平均每天可花</div>
      <div class="value" id="avgPerDay">--</div>
    </div>
  </div>

  <div class="card">
    <div class="progress-outer"><div class="progress-inner" id="progressBar" style="width:0%"></div></div>
  </div>

  <div class="section-title">記一筆</div>
  <div class="card">
    <form class="add" id="addForm">
      <input type="number" inputmode="decimal" step="1" min="0" placeholder="金額" id="amountInput" required>
      <button type="submit">新增</button>
    </form>
    <div class="row2">
      <input type="text" placeholder="備註（選填）" id="noteInput">
      <input type="date" id="dateInput">
    </div>
  </div>

  <div class="section-title">本月支出紀錄</div>
  <div class="card">
    <ul class="expense-list" id="expenseList"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">這個月還沒有任何紀錄</div>
  </div>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>設定</h2>
    <div class="field">
      <label>每月預算金額</label>
      <input type="number" inputmode="decimal" min="0" id="settingBudget" placeholder="例如 20000">
    </div>
    <div class="field">
      <label>發薪日 / 每月從幾號開始算一輪</label>
      <input type="number" min="1" max="28" id="settingCycleDay" placeholder="例如 5">
      <div class="hint">例如發薪日是 5 號，這裡就填 5，代表每個月 5 號～下個月 4 號算一輪預算。</div>
    </div>
    <div class="actions">
      <button class="secondary" id="closeSettings">取消</button>
      <button class="primary" id="saveSettings">儲存</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'dailyBudgetTracker_v1';

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { monthlyBudget: null, cycleStartDay: 1, expenses: [] };
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();

function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function daysBetween(a,b){
  return Math.round((b-a)/86400000);
}

function getCycle(){
  const startDay = Math.min(Math.max(parseInt(state.cycleStartDay)||1,1),28);
  const now = parseISO(todayISO());
  let cycleStart;
  if(now.getDate() >= startDay){
    cycleStart = new Date(now.getFullYear(), now.getMonth(), startDay);
  } else {
    cycleStart = new Date(now.getFullYear(), now.getMonth()-1, startDay);
  }
  const cycleEnd = new Date(cycleStart.getFullYear(), cycleStart.getMonth()+1, startDay);
  const totalDays = daysBetween(cycleStart, cycleEnd);
  const daysElapsed = daysBetween(cycleStart, now) + 1;
  const daysRemaining = totalDays - daysElapsed + 1;
  return { cycleStart, cycleEnd, totalDays, daysElapsed, daysRemaining, now };
}

function money(n){
  const r = Math.round(n);
  return (r<0?'-':'') + '$' + Math.abs(r).toLocaleString();
}

function render(){
  const hasBudget = state.monthlyBudget && state.monthlyBudget > 0;
  document.getElementById('dateInput').value = todayISO();

  if(!hasBudget){
    document.getElementById('todayAmount').textContent = '請先設定預算';
    document.getElementById('todayAmount').className = 'amount';
    document.getElementById('todayNote').textContent = '點右上角 ⚙️ 設定每月預算與發薪日';
    document.getElementById('spentTotal').textContent = '--';
    document.getElementById('budgetTotal').textContent = '--';
    document.getElementById('daysLeft').textContent = '--';
    document.getElementById('avgPerDay').textContent = '--';
    document.getElementById('progressBar').style.width = '0%';
    renderExpenseList([]);
    return;
  }

  const { cycleStart, cycleEnd, totalDays, daysRemaining } = getCycle();
  const todayStr = todayISO();

  const cycleExpenses = state.expenses.filter(e=>{
    const d = parseISO(e.date);
    return d >= cycleStart && d < cycleEnd;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.ts - a.ts);

  const spentTotal = cycleExpenses.reduce((s,e)=>s+e.amount,0);
  const spentToday = cycleExpenses.filter(e=>e.date===todayStr).reduce((s,e)=>s+e.amount,0);
  const spentBeforeToday = spentTotal - spentToday;

  const budget = state.monthlyBudget;
  const remainingAtStartOfToday = budget - spentBeforeToday;
  const daysRemainingClamped = Math.max(daysRemaining, 1);
  const suggestedToday = remainingAtStartOfToday / daysRemainingClamped;
  const leftToSpendToday = suggestedToday - spentToday;

  const amountEl = document.getElementById('todayAmount');
  amountEl.textContent = money(leftToSpendToday);
  amountEl.className = 'amount ' + (leftToSpendToday >= 0 ? 'ok' : 'over');

  const noteEl = document.getElementById('todayNote');
  if(leftToSpendToday >= 0){
    noteEl.textContent = `今天已花 ${money(spentToday)}，剩下 ${daysRemaining} 天`;
  } else {
    noteEl.textContent = `已經超出今天的額度，之後幾天要少花一點囉（剩 ${daysRemaining} 天）`;
  }

  document.getElementById('spentTotal').textContent = money(spentTotal);
  document.getElementById('budgetTotal').textContent = money(budget);
  document.getElementById('daysLeft').textContent = daysRemaining + ' 天';
  document.getElementById('avgPerDay').textContent = money(budget/totalDays) + ' /天';

  const pct = Math.min(100, Math.max(0, (spentTotal/budget)*100));
  const bar = document.getElementById('progressBar');
  bar.style.width = pct + '%';
  bar.className = 'progress-inner' + (spentTotal>budget ? ' over':'');

  renderExpenseList(cycleExpenses);
}

function renderExpenseList(list){
  const ul = document.getElementById('expenseList');
  const empty = document.getElementById('emptyMsg');
  ul.innerHTML = '';
  if(list.length===0){
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  for(const e of list){
    const li = document.createElement('li');
    const info = document.createElement('div');
    info.className='info';
    const note = document.createElement('div');
    note.className='note';
    note.textContent = e.note && e.note.trim() ? e.note : '（無備註）';
    const date = document.createElement('div');
    date.className='date';
    date.textContent = e.date;
    info.appendChild(note);
    info.appendChild(date);

    const right = document.createElement('div');
    right.style.display='flex';
    right.style.alignItems='center';
    const amt = document.createElement('span');
    amt.className='amt';
    amt.textContent = money(e.amount);
    const del = document.createElement('button');
    del.className='del';
    del.textContent = '✕';
    del.onclick = ()=>{
      state.expenses = state.expenses.filter(x=>x.id!==e.id);
      saveState();
      render();
    };
    right.appendChild(amt);
    right.appendChild(del);

    li.appendChild(info);
    li.appendChild(right);
    ul.appendChild(li);
  }
}

document.getElementById('addForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('amountInput').value);
  if(!amount || amount<=0) return;
  const note = document.getElementById('noteInput').value;
  const date = document.getElementById('dateInput').value || todayISO();
  state.expenses.push({ id: Date.now()+Math.random().toString(36).slice(2), amount, note, date, ts: Date.now() });
  saveState();
  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('amountInput').focus();
  render();
});

const settingsModal = document.getElementById('settingsModal');
document.getElementById('openSettings').onclick = ()=>{
  document.getElementById('settingBudget').value = state.monthlyBudget || '';
  document.getElementById('settingCycleDay').value = state.cycleStartDay || 1;
  settingsModal.classList.add('show');
};
document.getElementById('closeSettings').onclick = ()=> settingsModal.classList.remove('show');
document.getElementById('saveSettings').onclick = ()=>{
  const b = parseFloat(document.getElementById('settingBudget').value);
  const c = parseInt(document.getElementById('settingCycleDay').value);
  if(b && b>0) state.monthlyBudget = b;
  if(c && c>=1 && c<=28) state.cycleStartDay = c;
  saveState();
  settingsModal.classList.remove('show');
  render();
};

render();
if(!state.monthlyBudget){
  document.getElementById('openSettings').click();
}
</script>
</body>
</html>
